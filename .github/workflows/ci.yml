name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

          # Install scanners via go (avoids platform-specific release asset names)
          go install github.com/gitleaks/gitleaks/v8@v8.30.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.2

          echo "PATH=$PATH:$(go env GOPATH)/bin" >> "$GITHUB_ENV"

      - name: Run repo security scan
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash scripts/repo-security-scan/scan.sh --repo . --out .repo-security-scan/out

      - name: Smoke test scan script
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash scripts/repo-security-scan/test.sh

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-security-scan
          path: |
            .repo-security-scan/out
            .repo-security-scan/out-test

  skills-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo layout
        run: |
          set -euo pipefail
          find skills -maxdepth 2 -type f -name SKILL.md -print
